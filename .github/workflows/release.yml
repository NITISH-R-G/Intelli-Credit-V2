name: Release Drafter

# Drafts release notes from merged pull requests using conventional-commit
# labels. Deterministic — no AI, no API keys, no recurring cost. It only
# updates the *draft* release; a maintainer must publish it manually.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@3f0f87098bd6b5c5b9a36d49c41d998ea58f9348
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
