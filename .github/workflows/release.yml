name: Release Drafter

# Drafts release notes from merged pull requests using conventional-commit
# labels. Deterministic — no AI, no API keys, no recurring cost. It only
# updates the *draft* release; a maintainer must publish it manually.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@67e173cadb2fbd3de94f4a861e0c48c913b462ae
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
