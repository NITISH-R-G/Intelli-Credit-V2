name: License Compliance

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check Licenses
        run: npx license-checker --summary --failOn "GPL;AGPL;LGPL"
