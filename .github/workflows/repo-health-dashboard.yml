name: Repository Health Dashboard

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for accurate git history metrics

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Dashboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate:dashboard

      - name: Commit Dashboard Updates
        if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'schedule'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/dashboard.html
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs: Auto-update Repository Health Dashboard [skip ci]"
            git push
          fi
