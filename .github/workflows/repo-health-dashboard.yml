name: Repository Health Dashboard

# Manual-only. Previously this ran on push/PR/release/daily and auto-committed
# docs/dashboard.html to main. It also requested `pages: write` +
# `id-token: write` but never deployed to Pages (over-broad). Run it manually
# (Actions tab → "Run workflow") when you want a refreshed health dashboard.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for accurate git history metrics

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Dashboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate:dashboard

      - name: Commit Dashboard Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/dashboard.html
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs: refresh Repository Health Dashboard [skip ci]"
            git push
          fi
