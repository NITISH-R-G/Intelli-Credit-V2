name: AI Continuous Improvement
on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:
jobs:
  ai-improve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run AI Improvement Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:improve
      - name: Commit Improvement Report History
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/history/
          git commit -m "docs(ai): update daily improvement report history" || exit 0
          git push
      - name: Create Issue for Recommendations
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd
        with:
          title: 'AI Daily Improvement Recommendations'
          content-filepath: docs/history/ai-improvement-report.md
          labels: ai, improvement, enhancement
