name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run AI Improvement Analysis
        run: npm run ai:improve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Issue from Report
        if: hashFiles('ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e470eea31ce6f1a07e7 # v5.0.1
        with:
          title: 'Automated AI Continuous Improvement Report'
          content-filepath: ai-improvement-report.md
          labels: |
            enhancement
            tech-debt
