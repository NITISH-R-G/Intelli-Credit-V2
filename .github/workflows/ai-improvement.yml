name: AI Continuous Improvement Loop

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Improvement Loop Script
        run: npm run ai:improve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Improvement Issue
        if: hashFiles('ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed9821f10d60ef3cb50f68c78c2 # v5.0.0
        with:
          title: "[AI Continuous Improvement] Routine Repository Analysis Recommendations"
          content-filepath: ai-improvement-report.md
          labels: enhancement, ai-suggestion