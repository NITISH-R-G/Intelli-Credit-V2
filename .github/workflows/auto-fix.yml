name: Repository Self-Healing

# Manual-only. Previously this ran on every push/PR + daily, auto-committing
# formatting/lint fixes directly to the branch — which raced with contributor
# work and reverted intentional changes. CI now *reports* lint failures
# instead of rewriting branches. Run this manually when you want a format
# pass applied to the current default branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Auto-fix Formatting and Linting
        run: |
          npm run format || true
          npm run lint:fix || true

      - name: Run Self-Healing Script (auto-fix.ts)
        run: npm run fix || true

      - name: Commit fixes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -u
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(auto-fix): self-healing repository formatting and lint fixes [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
