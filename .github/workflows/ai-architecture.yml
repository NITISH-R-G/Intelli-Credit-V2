name: AI Architecture Intelligence

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze-and-diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d59600a944203117b4c910fa78c1827b5bddfa

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Architecture Analysis
        run: npx --yes tsx scripts/automation/analyze-repo.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Generate Knowledge Graph
        run: npx --yes madge --json src/ server.ts api/ > docs/architecture/knowledge-graph.json || true

      - name: Generate Dependency Diagrams
        run: npx --yes madge --image docs/architecture/dependency-graph.svg src/ server.ts api/ || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          title: 'docs(architecture): autonomous update to architecture docs and diagrams'
          commit-message: 'docs(architecture): autonomous update to architecture docs and diagrams'
          branch: 'chore/auto-architecture-update'
          labels: 'documentation, automated'
