name: AI Issue Triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Node.js
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: npm run ai:triage

      - name: Post Triage Comment
        if: hashFiles('triage-comment.txt') != ''
        uses: peter-evans/create-or-update-comment@b78cb5fdafdce7a955b9f391405deae19e32386d
        with:
          issue-number: ${{ github.event.issue.number }}
          body-path: triage-comment.txt
