name: AI Issue Triage

on:
  issues:
    types: [opened]

jobs:
  ai-triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Node
        uses: actions/setup-node@32f57ac043e003bc1b07edcb2b9102bbbf3e92f1
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: npm run ai:triage

      - name: Post Triage Comment
        if: hashFiles('triage-comment.txt') != ''
        uses: peter-evans/create-or-update-comment@6b65298e27703bd026057331221d8bec87659ee3
        with:
          issue-number: ${{ github.event.issue.number }}
          body-path: triage-comment.txt
