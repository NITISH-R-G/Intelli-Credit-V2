name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Simulating AI review generation..."
          echo "AI Review: LGTM! The code looks solid and secure." > pr-review.txt

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: pr-review.txt
          comment-tag: pr-review
