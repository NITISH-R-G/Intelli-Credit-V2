name: AI PR Reviewer

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Use Node.js 20
        uses: actions/setup-node@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch PR Diff
        run: >
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          -H "Accept: application/vnd.github.v3.diff"
          "${{ github.event.pull_request.url }}" > pr-diff.txt

      - name: Run AI PR Review
        run: npx --yes tsx scripts/automation/ai-pr-review.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Comment on PR
        if: hashFiles('pr-comment.txt') != ''
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          file-path: pr-comment.txt
          comment-tag: ai-pr-review
