name: Autonomous Repository Improver

on:
  schedule:
    - cron: '0 4 * * *' # Run daily at 4 AM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Autonomous Improver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run improve:repo || true

      - name: Commit fixes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs(auto-improve): Update technical debt report [skip ci]"
            git push
          else
            echo "No technical debt updates to commit"
          fi
