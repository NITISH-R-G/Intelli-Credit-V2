name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  improve:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@8f152de45cc393f58c3f4e24eb37452d1921cd68
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Improvement Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:improve

      - name: Create Improvement Issue
        if: hashFiles('ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd
        with:
          title: 'Daily AI Continuous Improvement Recommendations'
          content-filepath: ai-improvement-report.md
          labels: 'enhancement, AI'
