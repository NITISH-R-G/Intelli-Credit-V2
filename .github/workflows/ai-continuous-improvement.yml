name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * *' # Run daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff46
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run AI Improvement Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:improve

      - name: Create Issue from Report
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e8ef132
        with:
          title: 'Daily AI Continuous Improvement Report'
          content-filepath: docs/history/ai-improvement-report.md
          labels: 'enhancement, automated-report'
