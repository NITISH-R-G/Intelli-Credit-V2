name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Run AI Improve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx --yes tsx scripts/automation/ai-improve.ts

      - name: Run Repo Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx --yes tsx scripts/automation/analyze-repo.ts

      - name: Generate Diagrams
        run: npx --yes tsx scripts/automation/generate-diagrams.ts

      - name: Generate Knowledge Graph
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx --yes tsx scripts/automation/generate-knowledge-graph.ts

      - name: Create Issue from Report
        if: hashFiles('ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@7566479717778afbc2682cfc86b2306401c6d554
        with:
          title: 'Daily AI Improvement Recommendations'
          content-filepath: ./ai-improvement-report.md
          labels: 'ai-recommendation, enhancement'

      - name: Create Pull Request for Docs
        uses: peter-evans/create-pull-request@11fa467881691ac900904a2eea702c5ea848ad13
        with:
          commit-message: 'docs: Update architecture and knowledge graph'
          title: 'Automated Architecture Updates'
          body: 'This PR updates the repository architecture and knowledge graph.'
          branch: automated-architecture-updates
