name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * *' # Run daily
  workflow_dispatch:

jobs:
  improve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ff24fba452586c8f6140
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run AI Improve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:improve

      - name: Create Issue from Report
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e73bcd7bab1f508c534cb06729318cabb9632a17
        with:
          title: 'Automated AI Repository Improvement Suggestions'
          content-filepath: 'docs/history/ai-improvement-report.md'
          labels: 'enhancement, ai-suggestion'
