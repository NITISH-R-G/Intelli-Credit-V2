name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  improve-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Improvement Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:improve

      - name: Open Improvement Issue
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd
        with:
          title: '🤖 AI Continuous Improvement Report'
          content-filepath: docs/history/ai-improvement-report.md
          labels: enhancement, ai-report

      - name: Run Self-Healing
        run: npm run fix || true

      - name: Create Self-Healing Pull Request
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f
        with:
          commit-message: 'chore(self-healing): auto-fix code style and linting issues'
          title: '🤖 Autonomous Self-Healing'
          body: 'This pull request was automatically generated by the AI Continuous Improvement workflow to address code style and linting issues.'
          branch: 'auto/self-healing'
          labels: automation, cleanup
