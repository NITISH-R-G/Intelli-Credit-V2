name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * *' # Run daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run AI Improvement Loop
        run: npm run ai:improve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Improvement Issue
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd
        with:
          title: '🤖 Daily AI Continuous Improvement Report'
          content-filepath: docs/history/ai-improvement-report.md
          labels: ai-enhancement, automation
