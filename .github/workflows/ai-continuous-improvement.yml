name: AI Continuous Improvement Loop

on:
  schedule:
    - cron: '0 8 * * *' # Run daily at 8 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  analyze-and-improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Analyze Repo and Generate Diagrams
        run: npx --yes tsx scripts/automation/analyze-repo.ts

      - name: Run AI Maintainer Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx --yes tsx scripts/automation/ai-maintainer.ts

      - name: Create Issue for Improvements
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e470eea31ce6a14a5cb
        with:
          title: '🤖 Daily AI Repository Analysis & Improvement Plan'
          content-filepath: docs/history/ai-improvement-report.md
          labels: 'ai-maintenance, enhancement'

      - name: Create PR for Architecture Changes
        uses: peter-evans/create-pull-request@b1ddad2c994a25fbc81a28b3ec0e368bb2021c50
        with:
          commit-message: 'docs: update architecture diagrams and knowledge graph'
          title: '🤖 Autonomous Architecture Update'
          body: 'Automated update of repository architecture diagrams and knowledge graph.'
          branch: 'automation/arch-update'
          labels: 'documentation, ai-automation'
