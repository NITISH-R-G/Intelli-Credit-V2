name: Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * 1' # Run weekly on Mondays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve-repo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Repository Analyzer (pre-requisite)
        run: npm run analyze:repo
        continue-on-error: true

      - name: Run AI Improvement Analyzer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run improve:repo
        continue-on-error: true

      - name: Commit Improvement Reports
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/improvements/ || true
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs(improvements): auto-generated weekly improvement report [skip ci]"
            git push
          fi
