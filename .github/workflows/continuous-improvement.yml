name: Continuous Improvement Loop

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  improve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Improve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:improve > improvement_suggestions.txt

      - name: Create Issue from Suggestions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('improvement_suggestions.txt')) {
               const content = fs.readFileSync('improvement_suggestions.txt', 'utf8').trim();
               if (content && !content.includes('Error')) {
                  github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: 'Automated AI Code Improvement Suggestion',
                    body: content,
                    labels: ['enhancement', 'ai-suggestion']
                  });
               }
            }
