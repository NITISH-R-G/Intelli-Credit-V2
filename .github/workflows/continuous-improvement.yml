name: Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Improvement Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run ai:improve

      - name: Create Pull Request with Improvements
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: AI suggested improvements'
          title: '🤖 AI Suggested Improvements'
          body: 'This PR contains automated recommendations and self-healing fixes.'
          branch: 'ai/continuous-improvement'
