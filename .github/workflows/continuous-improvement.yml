name: Continuous Improvement Loop

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  analyze_and_improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: AI Codebase Improvement
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx --yes tsx scripts/automation/ai-improve.ts

      - name: Create Issue from AI Report
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd
        with:
          title: 'Automated AI Codebase Improvement Recommendations'
          content-filepath: 'docs/history/ai-improvement-report.md'
          labels: 'ai-recommendation, enhancement'

      - name: Analyze Repo and Generate Diagrams
        run: npx --yes tsx scripts/automation/analyze-repo.ts

      - name: Self-Healing (Auto Fix)
        run: |
          npm run lint:fix || true
          npm run format || true

      - name: Create Pull Request for Fixes and Docs
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          commit-message: 'chore: autonomous repository maintenance and documentation updates'
          title: 'Autonomous Repository Maintenance & Intelligence Updates'
          body: 'This PR contains automated lint/format fixes and updated architecture diagrams generated by the Continuous Improvement Loop.'
          branch: 'auto-maintenance'
          base: 'main'
