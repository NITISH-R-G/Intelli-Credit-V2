name: Architecture Intelligence

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Node.js
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Run Architecture Analysis
        run: |
          npm run analyze:repo
          npm run generate:diagrams
          npm run generate:knowledge-graph

      - name: Create Pull Request for Diagrams
        uses: peter-evans/create-pull-request@b99c9ae23bcf83f0f5aa571c2f0093de8aa85036
        with:
          commit-message: "docs: Update architecture diagrams and knowledge graph"
          title: "docs: Update architecture intelligence"
          body: "Automated updates to architecture diagrams and repository knowledge graph."
          branch: "docs/auto-update-architecture"
          labels: "documentation, architecture"
