name: Architecture Intelligence

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/architecture/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Analyze Repo and Generate Graphs
        run: npm run analyze:repo

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@153407881ce5f5b40b719053c8e31ba1df104d55
        with:
          commit-message: 'docs: auto-update architecture diagrams and knowledge graph'
          title: 'Automated Architecture Documentation Update'
          body: 'This PR automatically updates the repository architecture diagrams and knowledge graph using Madge.'
          branch: 'auto/architecture-update'
          delete-branch: true
          labels: 'documentation, automated-pr'
