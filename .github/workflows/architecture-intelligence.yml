name: Architecture Intelligence
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/architecture/**'

permissions:
  pull-requests: write
  contents: write

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Generate Diagrams
        run: npm run generate:diagrams
      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@153407881ce5f5b0806cb7b7702f23b2b938f3be
        with:
          title: 'docs: Update Architecture Diagrams & Knowledge Graph'
          branch: 'chore/update-architecture'
          commit-message: 'docs: Update Architecture Diagrams & Knowledge Graph'
          body: 'Automatically generated architecture diagrams and knowledge graph updates.'
