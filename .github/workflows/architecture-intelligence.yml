name: Architecture Intelligence
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/architecture/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Generate Architecture Intelligence
        run: npm run analyze:repo

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          commit-message: 'docs(architecture): autonomous update of diagrams and knowledge graph'
          title: 'docs(architecture): Autonomous Update'
          body: 'Automatically generated updates to repository architecture intelligence.'
          branch: 'automation/architecture-update'
          labels: 'documentation, automation'
