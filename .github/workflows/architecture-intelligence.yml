name: Architecture Intelligence

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: npm ci

      - name: Initialize analysis metadata
        run: npm run analyze:repo

      - name: Generate dependency graph
        run: npm run generate:diagrams

      - name: Generate knowledge graph JSON
        run: npm run generate:knowledge-graph

      - name: Commit architecture artifacts
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: 'docs(architecture): update repository knowledge graph and diagrams'
          title: '🤖 Auto-update: Architecture Intelligence'
          body: 'Automated updates to architecture diagrams and knowledge graph generated by `madge`.'
          branch: 'auto-update/architecture-intelligence'
          base: ${{ github.head_ref || github.ref_name }}
