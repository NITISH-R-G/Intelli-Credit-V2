name: Architecture Intelligence & Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze-and-document:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          cache: 'npm'

      - name: Install system dependencies (graphviz)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Dependencies
        run: npm ci

      - name: Run Repository Analysis
        run: npm run analyze:repo

      - name: Generate Architecture Diagrams
        run: npm run generate:diagrams

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Create Pull Request with Documentation Updates
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f
        with:
          commit-message: 'docs: Auto-generate architecture diagrams and analysis'
          title: 'Automated Architecture & Intelligence Updates'
          body: 'This PR contains auto-generated architecture diagrams and repository analysis.'
          branch: 'auto-arch-updates'
          labels: 'documentation, automated'
