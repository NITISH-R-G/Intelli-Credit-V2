name: Architecture Intelligence

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'api/**'
      - 'package.json'
  schedule:
    - cron: '0 12 * * 1' # Run weekly on Mondays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff46
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Run Repository Analysis
        run: npm run analyze:repo

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@67ccf78
        with:
          title: 'Automated Architecture Intelligence Update'
          body: 'This PR updates the repository architecture diagrams and knowledge graph generated by madge.'
          branch: 'automated-architecture-update'
          commit-message: 'docs(architecture): update diagrams and knowledge graph'
          labels: 'documentation, automated-pr'
