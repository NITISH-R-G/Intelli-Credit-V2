name: Architecture Intelligence

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/architecture/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Analyze Repository
        run: npm run analyze:repo

      - name: Generate Diagrams
        run: npm run generate:diagrams

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Create Pull Request for Architecture Updates
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # v7.0.6
        with:
          commit-message: 'docs(architecture): update intelligence graphs and diagrams'
          title: 'docs(architecture): Update Intelligence Graphs'
          body: 'Automated update of architecture diagrams and repository knowledge graph.'
          branch: 'automation/architecture-update'
          labels: documentation, automated-pr
