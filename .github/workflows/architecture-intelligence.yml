name: Architecture Intelligence

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/architecture/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Dependencies
        run: npm ci

      - name: Run Architecture Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run analyze:repo

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@153407881ce5f5b8cb39d7367cb62cb1fc4dd368
        with:
          title: 'docs: update architecture documentation'
          body: 'Auto-generated updates to architecture diagrams and knowledge graph.'
          branch: 'auto/architecture-update'
          commit-message: 'docs: update architecture documentation'
          base: 'main'
