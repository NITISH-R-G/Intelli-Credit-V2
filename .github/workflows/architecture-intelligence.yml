name: Architecture Intelligence
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/architecture/**'
jobs:
  analyze-and-diagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Generate Diagrams & Knowledge Graph
        run: |
          mkdir -p docs/architecture
          npm run generate:diagrams
          npm run generate:knowledge-graph
      - name: Run Architecture Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run analyze:repo
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          commit-message: 'docs(architecture): update intelligence diagrams and summary'
          title: 'docs(architecture): autonomous update of architecture artifacts'
          body: 'Automated PR to update architecture diagrams, knowledge graph, and AI summary.'
          branch: 'chore/update-architecture'
