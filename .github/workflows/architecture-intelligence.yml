name: Architecture Intelligence

on:
  schedule:
    - cron: '0 4 * * 0' # Run weekly on Sunday at 4am
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Generate Intelligence
        run: |
          npm run analyze:repo
          npm run generate:diagrams
          npm run generate:knowledge-graph

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@6d6857d36972b65feb161a90e484f2984215f83e
        with:
          title: "docs: Update Architecture Intelligence"
          body: "This is an automated PR updating repository analysis, architecture diagrams, and knowledge graph."
          branch: "automation/architecture-update"
          commit-message: "docs: update architecture intelligence outputs"
          labels: "documentation, automated-pr"
