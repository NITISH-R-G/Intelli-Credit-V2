name: Architecture Intelligence

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'api/**'
      - 'package.json'
      - 'tsconfig.json'
    paths-ignore:
      - 'docs/architecture/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: npm ci

      - name: Generate Diagrams
        run: mkdir -p docs/architecture && npm run generate:diagrams

      - name: Generate Knowledge Graph
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate:knowledge-graph

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f
        with:
          title: 'docs: Update architecture diagrams and knowledge graph'
          commit-message: 'docs: Update architecture diagrams and knowledge graph'
          branch: 'chore/update-architecture'
          body: 'Automated PR to update architecture diagrams and knowledge graph.'
          labels: documentation
