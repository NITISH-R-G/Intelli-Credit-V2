name: Architecture Intelligence

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/architecture/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Generate Diagrams
        run: npm run generate:diagrams

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "docs(architecture): Update knowledge graph and diagrams"
          title: "docs(architecture): Automated Architecture Update"
          body: "This PR automatically updates the repository architecture diagrams and knowledge graph based on recent changes."
          branch: "automated-architecture-update"
          base: "main"
