name: Architecture Intelligence

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'scripts/automation/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@8f152de45cc393f58c3f4e24eb37452d1921cd68
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Generate Intelligence Artifacts
        run: |
          npm run analyze:repo
          npm run generate:diagrams
          npm run generate:knowledge-graph

      - name: Commit and Push Changes
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-generate architecture intelligence artifacts" && git push)
