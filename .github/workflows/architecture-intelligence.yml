name: Architecture Intelligence

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/architecture/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d59600e57ba57912a7f34f71a0afbaedc29b7a # v4

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install graphviz
        run: sudo apt-get install -y graphviz

      - name: Generate Diagrams
        run: npm run generate:diagrams

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7
        with:
          title: 'Automated Architecture Documentation Update'
          body: 'Automatically generated architecture diagrams and knowledge graph from recent codebase changes.'
          commit-message: 'docs(architecture): update intelligence diagrams'
          branch: auto-arch-update
          labels: 'documentation, architecture'
