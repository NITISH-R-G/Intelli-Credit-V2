name: Architecture Intelligence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Repo Analysis
        run: npm run analyze:repo

      - name: Run Architecture Diagram Generation
        run: npm run generate:diagrams

      - name: Run Knowledge Graph Generation
        run: npm run generate:knowledge-graph

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/architecture/
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update architecture intelligence [skip ci]" && git push)
