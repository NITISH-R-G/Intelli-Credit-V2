name: Architecture Intelligence

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/architecture/**'
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Generate Architecture Analysis
        run: npm run analyze:repo

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@153407881e1861396ce2222ac1f01cc461239c00
        with:
          title: 'docs: Update Architecture Diagrams & Knowledge Graph'
          body: 'Automatically generated architecture diagrams and knowledge graph via madge.'
          branch: 'update-architecture'
          commit-message: 'docs: update architecture diagrams'
