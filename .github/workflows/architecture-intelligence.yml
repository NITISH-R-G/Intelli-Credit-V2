name: Architecture Intelligence

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Install graphviz
        run: sudo apt-get install -y graphviz

      - name: Install dependencies
        run: npm ci

      - name: Generate Diagrams
        run: npm run generate:diagrams

      - name: Analyze Repo
        run: npm run analyze:repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          commit-message: "docs(architecture): autonomous update of architecture docs and diagrams"
          title: "docs(architecture): Autonomous Update"
          body: "This PR automatically updates the architecture diagrams, repo analysis, and knowledge graph."
          branch: "chore/architecture-update"
          base: "main"
