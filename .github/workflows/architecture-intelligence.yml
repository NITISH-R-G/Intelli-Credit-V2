name: Architecture Intelligence

on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ff24fba452586c8f6140
        with:
          node-version: 22

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Architecture Analysis
        run: npm run analyze:repo

      - name: Create Pull Request for Architecture Updates
        uses: peter-evans/create-pull-request@11e8dc7c9cc95aabee9cfaa85faaec8b50907340
        with:
          commit-message: 'docs(architecture): update intelligence diagrams and knowledge graph'
          title: 'docs(architecture): Automated architecture intelligence update'
          body: 'This PR automatically updates the repository architecture diagrams and knowledge graph based on recent code changes.'
          branch: 'automation/architecture-intelligence'
          labels: 'documentation, automated-pr'
