name: Architecture Intelligence

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/architecture/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup Node.js
        uses: actions/setup-node@680d1e489b82f1243de15bc7665c0007e3c9a860 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Run Architecture Analysis
        run: npm run analyze:repo

      - name: Generate Diagrams
        run: npm run generate:diagrams

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@11e8dc7c9cc95aabee9cfaa85faaec8b50907340 # v7
        with:
          title: 'docs(architecture): Automated update of architecture intelligence'
          commit-message: 'docs(architecture): Update diagrams and knowledge graph'
          branch: 'auto-update-architecture'
          labels: 'documentation, architecture'
          body: 'Automated updates to architecture diagrams and knowledge graph based on recent codebase changes.'
