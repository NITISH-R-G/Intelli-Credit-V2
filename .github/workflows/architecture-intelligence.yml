name: Architecture Intelligence

on:
  push:
    branches:
      - main

jobs:
  analyze-and-document:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: npm ci

      - name: Generate Diagrams
        run: npm run generate:diagrams

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Create Pull Request for Documentation Updates
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f
        with:
          commit-message: 'docs: auto-update architecture documentation'
          title: '🤖 Auto-update Architecture Documentation'
          body: 'This PR automatically updates the architecture diagrams and knowledge graph based on recent code changes.'
          branch: 'auto-update-docs'
          labels: 'documentation, automated-pr'
