name: Architecture Intelligence

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'api/**'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup Node.js
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Dependencies
        run: npm ci

      - name: Run Architecture Analysis
        run: npm run analyze:repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c9f8b51aaac1dfba340a97878061732b0e738ec1 # v7
        with:
          commit-message: 'docs(architecture): Autogenerate diagrams and analysis'
          title: 'docs(architecture): Update architectural intelligence'
          body: 'Automated updates to dependency graph and AI architectural analysis.'
          branch: 'ai/architecture-update'
