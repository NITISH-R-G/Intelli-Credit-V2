name: Architecture Intelligence

on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'api/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  generate-architecture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Run Repository Analysis
        run: npm run analyze:repo

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: 'docs: Update architecture diagrams and knowledge graph'
          title: 'Automated Architecture Intelligence Update'
          body: 'This PR updates the repository architecture diagrams and knowledge graph.'
          branch: 'auto/architecture-update'
          labels: documentation, automated
