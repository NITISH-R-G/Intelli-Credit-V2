name: Architecture Intelligence

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@11d5960a326750d5838078e36cf38b85af677262
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Graphviz)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: npm ci

      - name: Create Docs Architecture Directory
        run: mkdir -p docs/architecture

      - name: Generate Diagrams
        run: npm run generate:diagrams

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          commit-message: 'docs: Update architecture diagrams and knowledge graph'
          title: '🤖 Auto-Update Architecture Intelligence'
          body: 'This PR automatically updates the dependency graph and knowledge graph.'
          branch: 'auto-architecture-update'
