name: Architecture Update

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'api/**'
      - 'server.ts'
      - 'package.json'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Analyze Repo
        run: npx --yes tsx scripts/automation/analyze-repo.ts

      - name: Generate Diagrams
        run: npx --yes tsx scripts/automation/generate-diagrams.ts

      - name: Generate Knowledge Graph
        run: npx --yes tsx scripts/automation/generate-knowledge-graph.ts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          title: 'docs: update architecture diagrams and knowledge graph'
          body: 'Automated update of architecture diagrams and repository knowledge graph.'
          branch: 'automation/architecture-update'
          commit-message: 'docs: update architecture diagrams and knowledge graph'
          labels: 'documentation, automation'
