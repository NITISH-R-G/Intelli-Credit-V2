name: Self-Healing Repository

on:
  schedule:
    - cron: '0 1 * * *' # Every day at 1 AM UTC
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6824024
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Self-Healing
        run: npm run fix

      - name: Create Pull Request for Fixes
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          title: 'fix(auto): Autonomous Self-Healing'
          commit-message: 'fix(auto): automated linting and formatting fixes'
          branch: 'auto/self-healing'
          body: 'This PR contains automated linting and formatting fixes generated by `npm run fix`.'
          labels: 'automated pr, enhancement'
