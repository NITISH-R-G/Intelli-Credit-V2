name: Autonomous Architecture Intelligence

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *' # Run daily at 2 AM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 20

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Architecture Diagrams and Graph
        run: npm run analyze:repo

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # v7
        with:
          commit-message: 'docs(architecture): autonomous update of diagrams and knowledge graph'
          title: '🤖 docs: Autonomous Architecture Update'
          body: 'Automated updates to `docs/architecture/` artifacts triggered by source code modifications.'
          branch: 'bot/autonomous-architecture'
          labels: 'documentation, architecture, autonomous'
