name: Autonomous Architecture Intelligence

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'api/**'
      - 'package.json'
  schedule:
    - cron: '0 0 * * 0' # Weekly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Analyze Repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run analyze:repo

      - name: Generate Diagrams
        run: npm run generate:diagrams

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: 'docs(architecture): autonomous update of architecture docs and diagrams'
          body: 'Automatically generated architecture documentation, diagrams, and knowledge graph.'
          branch: autonomous-architecture-update
          labels: documentation, automated pr
