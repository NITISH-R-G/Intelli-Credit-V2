name: Autonomous Architecture Intelligence

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820.x020.x # v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Dependencies
        run: npm ci

      - name: Analyze Repo and Generate Architecture
        run: npm run analyze:repo

      - name: Create Pull Request for Architecture Updates
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: 'docs(architecture): update architecture diagrams and knowledge graph'
          title: 'Update Architecture Diagrams and Knowledge Graph'
          body: 'This PR updates the repository architecture diagrams and knowledge graph based on recent code changes.'
          branch: 'auto/architecture-update'
