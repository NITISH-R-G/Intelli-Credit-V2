name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@85764d26dc72ce09477e7790b9b3df9bb561ef33
