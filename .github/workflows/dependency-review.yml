name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@11d59600a73b40d6cde101e4db95cddb2b80cc8e
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5
