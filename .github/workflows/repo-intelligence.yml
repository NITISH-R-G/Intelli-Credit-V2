name: Repository Intelligence

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

permissions:
  contents: write

jobs:
  generate-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Repo Analysis
        run: npm run analyze:repo

      - name: Generate Diagrams
        run: npm run generate:diagrams

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Commit Intelligence
        uses: stefanzweifel/git-auto-commit-action@8756aa072ef5b4a080af5dc8fef36c5d586e521d # v5
        with:
          commit_message: "docs: update repository intelligence"
          file_pattern: "docs/architecture/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
