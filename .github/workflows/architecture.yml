name: Autonomous Repository Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Node
        uses: actions/setup-node@32f57ac043e003bc1b07edcb2b9102bbbf3e92f1
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Install Dependencies
        run: npm ci

      - name: Run Repository Analysis
        run: npm run analyze:repo

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Generate Architecture Diagrams
        run: npm run generate:diagrams

      - name: Commit Generated Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/
          git commit -m "docs(auto): update autonomous repository architecture and knowledge graph" || echo "No changes to commit"
          git push origin main || echo "Nothing to push"
