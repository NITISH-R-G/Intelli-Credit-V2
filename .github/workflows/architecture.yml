name: Autonomous Architecture Intelligence

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Node Dependencies
        run: npm ci --ignore-scripts

      - name: Analyze Repo Directories
        run: npm run analyze:repo

      - name: Generate Architecture Diagrams
        run: npm run generate:diagrams

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          title: 'docs(architecture): Update Knowledge Graph and Diagrams'
          commit-message: 'docs(architecture): update architecture diagrams and knowledge graph'
          branch: 'update-architecture-docs'
          body: 'Automated PR updating architecture diagrams and knowledge graph generated by madge.'
          labels: documentation
