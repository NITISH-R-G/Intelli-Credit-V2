name: Architecture Intelligence

on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'api/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install System Dependencies for Madge
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Architecture Analysis
        run: npm run analyze:repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Knowledge Graph Generation
        run: npm run generate:knowledge-graph
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Diagrams Generation
        run: npm run generate:diagrams

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f
        with:
          commit-message: 'docs: autonomous architecture documentation update'
          title: '🤖 Autonomous Architecture Documentation Update'
          body: 'This is an automated PR updating the repository architecture documentation and dependency diagrams.'
          branch: 'automation/arch-docs'
          labels: 'documentation, architecture'
