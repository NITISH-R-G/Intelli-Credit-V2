name: Secret Scanning

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 0 * * 0' # Weekly

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basic Regex Secret Scan
        run: |
          echo "Scanning for potential hardcoded secrets..."
          # A simple grep to find generic high-entropy looking strings assigned to common secret names
          # Note: GitHub Advanced Security native secret scanning is recommended, but this serves as a basic CI step.
          SECRETS_FOUND=$(git grep -i -E "(api[_-]?key|secret|token|password)[\s]*=[\s]*['\"][a-zA-Z0-9_\-]{16,}['\"]" -- '*.ts' '*.js' '*.json' || true)

          if [ -n "$SECRETS_FOUND" ]; then
            echo "::error::Potential hardcoded secrets found!"
            echo "$SECRETS_FOUND"
            # We don't fail the build here because regex can be noisy, but we flag it
            # exit 1
          else
            echo "No obvious hardcoded secrets found in source files."
          fi
