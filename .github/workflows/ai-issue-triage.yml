name: AI Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ff24fba452586c8f6140
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run AI Triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: npm run ai:triage

      - name: Post Triage Comment
        if: hashFiles('triage-comment.txt') != ''
        uses: peter-evans/create-or-update-comment@34c8c3685e6cc7ac706e04c83308164410d8976f
        with:
          issue-number: ${{ github.event.issue.number }}
          body-path: triage-comment.txt
