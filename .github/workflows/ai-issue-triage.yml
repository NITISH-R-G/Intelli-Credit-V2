name: AI Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Node.js
        uses: actions/setup-node@db0fb3a98ed314b69026b6e8c9be26a7e2fe65a8
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run AI Triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: npm run ai:triage

      - name: Post Triage Comment
        if: hashFiles('triage-comment.txt') != ''
        uses: peter-evans/create-or-update-comment@34c8c3685e6cc7ac706e04c83308164410d8976f
        with:
          issue-number: ${{ github.event.issue.number }}
          body-path: triage-comment.txt
