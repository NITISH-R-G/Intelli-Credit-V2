name: CI/CD Automation

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use Node.js 20
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run security scans (audit)
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
