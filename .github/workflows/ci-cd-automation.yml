name: CI/CD Automation

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Graphviz (for architecture diagrams)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: npm ci

      - name: Self-Healing Automation (Fix Formatting and Linting)
        run: npm run fix

      - name: Commit self-healing changes
        if: matrix.node-version == '20.x'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: 'chore: self-healing code format and lint fixes'
          title: '🤖 Auto-healing: Code quality and formatting'
          body: 'This PR contains automated self-healing fixes generated by `npm run fix`.'
          branch: 'auto-healing/code-quality'
          base: ${{ github.head_ref || github.ref_name }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run security scans (audit)
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
