name: Autonomous Documentation & Architecture

on:
  push:
    branches: ['main']
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Use Node.js 20
        uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85 # v4.2.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Generate Architecture Diagrams
        run: npm run generate:diagrams

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Analyze Repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run analyze:repo

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@11fa467881691ac900904a2eea702c5ea848ad13 # v7.0.6
        with:
          commit-message: "docs(auto): update architecture diagrams and knowledge graph"
          title: "docs(auto): update architecture diagrams and knowledge graph"
          body: "Autonomous update of repository documentation, knowledge graph, and architecture diagrams."
          branch: "auto/docs-update"
          delete-branch: true
