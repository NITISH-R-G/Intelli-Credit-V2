name: Repository Intelligence

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install graphviz for madge
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Generate architecture diagram
        run: npx tsx scripts/automation/generate-diagrams.ts

      - name: Generate knowledge graph
        run: npx tsx scripts/automation/generate-knowledge-graph.ts

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "docs(architecture): auto-update diagrams and knowledge graph [skip ci]"
          file_pattern: docs/architecture/*
          branch: main
