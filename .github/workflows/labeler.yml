name: 'Pull Request Labeler'
# Uses the safe `pull_request` trigger (not `pull_request_target`). Labeling
# does not need the target's write token, and `pull_request` avoids running
# fork PR code with the repo's own secrets.
on:
  - pull_request

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@2c2a2313b245ae5cb1ddbddf76be67b266211c91
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          sync-labels: true
