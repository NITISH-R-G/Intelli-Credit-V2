name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 4 AM

permissions:
  contents: write
  issues: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup Node.js
        uses: actions/setup-node@680d1e489b82f1243de15bc7665c0007e3c9a860 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run AI Improve
        run: npm run ai:improve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Issue from Report
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e73bcd7bab1f508c534cb06729318cabb9632a17 # v5
        with:
          title: 'Daily AI Improvement Recommendations'
          content-filepath: docs/history/ai-improvement-report.md
          labels: enhancement, ai-recommendation
