name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d59600a944203117b4c910fa78c1827b5bddfa

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run AI Improvement Loop
        run: npx --yes tsx scripts/automation/ai-improve.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Issue from Report
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Daily AI Improvement Report'
          content-filepath: ./docs/history/ai-improvement-report.md
          labels: |
            enhancement
            automated
