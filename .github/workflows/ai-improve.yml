name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d59600e57ba57912a7f34f71a0afbaedc29b7a # v4

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ff24b5d4e12c140cb7e6 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run AI Improve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:improve

      - name: Create Issue
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e470eea31ce6f1a0d01 # v5
        with:
          title: 'Daily AI Improvement Suggestions'
          content-filepath: docs/history/ai-improvement-report.md
          labels: 'enhancement, ai-suggestion'
