name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch:

jobs:
  improve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6824024
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run AI Improvement Loop
        run: npm run ai:improve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Issue from Report
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd
        with:
          title: 'AI Improvement Recommendations'
          content-filepath: docs/history/ai-improvement-report.md
          labels: enhancement, help wanted, ai-generated
