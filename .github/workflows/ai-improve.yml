name: Continuous AI Improvement

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Node.js
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Improvement Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:improve

      - name: Create Issue from Report
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@7566479717778afbc2682cfc86b2306401c6d554
        with:
          title: Daily AI Improvement Recommendations
          content-filepath: docs/history/ai-improvement-report.md
          labels: enhancement, ai-recommendation

      - name: Create Pull Request for self-healing
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-pull-request@b99c9ae23bcf83f0f5aa571c2f0093de8aa85036
        with:
          title: 'Auto-apply AI improvement changes'
          branch: 'chore/ai-improvement'
          commit-message: 'chore: apply ai improvement changes'
          body: 'Automated changes triggered by daily AI improvement loop.'
