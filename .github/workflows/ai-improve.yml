name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run AI Improvement Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:improve

      - name: Open Issue with Recommendations
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e470beb3bbece1ec693
        with:
          title: 'Daily AI Improvement Recommendations'
          content-filepath: docs/history/ai-improvement-report.md
          labels: ai-recommendation
