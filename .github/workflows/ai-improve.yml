name: AI Continuous Improvement

on:
  schedule:
    - cron: '0 8 * * *' # Run daily at 8 AM UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  ai-improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d59600a73b40d6cde101e4db95cddb2b80cc8e

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ff24f5d17a50e9326d9c
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run AI Improve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:improve

      - name: Create Issue
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd
        with:
          title: 'Daily AI Improvement Report'
          content-filepath: docs/history/ai-improvement-report.md
          labels: enhancement, ai-report
