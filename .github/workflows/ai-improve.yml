name: AI Continuous Improvement Loop

on:
  schedule:
    - cron: '0 8 * * *' # Every day at 8:00 AM UTC
  workflow_dispatch:

jobs:
  improve:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup Node.js
        uses: actions/setup-node@7f84f1d52d0c56afb45c62fee31a93b843cea4d6 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run AI Improve Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai:improve

      - name: Create Issue from Report
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@e73bcd7bab1f508c534cb06729318cabb9632a17 # v5
        with:
          title: 'Automated AI Repository Improvement Recommendation'
          content-filepath: 'docs/history/ai-improvement-report.md'
          labels: |
            enhancement
            ai-recommendation
