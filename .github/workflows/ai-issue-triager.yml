name: AI Issue Triager

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: npm run ai:triage
        continue-on-error: true

      - name: Read Labels
        id: read_labels
        run: |
          if [ -f "ai-triage-labels.txt" ]; then
            echo "labels=$(cat ai-triage-labels.txt)" >> $GITHUB_OUTPUT
          else
            echo "labels=triage" >> $GITHUB_OUTPUT
          fi

      - name: Apply Labels
        uses: actions/github-script@v7
        with:
          script: |
            const labelsStr = '${{ steps.read_labels.outputs.labels }}';
            const labels = labelsStr.split(',').map(l => l.trim()).filter(l => l);
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }

      - name: Comment on Issue
        uses: thollander/actions-comment-pull-request@v3
        with:
          filePath: ai-triage-output.md
          comment_tag: ai_triage_welcome
          pr_number: ${{ github.event.issue.number }}
