name: AI Continuous Improvement Loop

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  analyze-and-improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: npm ci

      - name: Analyze Repo and Generate Improvements
        run: npx --yes tsx scripts/automation/ai-maintainer.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Issue for Report
        if: hashFiles('docs/history/ai-improvement-report.md') != ''
        uses: peter-evans/create-issue-from-file@22a9089034f40e5a961c8808d113e2c98fb63676 # v5
        with:
          title: 'AI Improvement Report: ${{ github.run_id }}'
          content-filepath: docs/history/ai-improvement-report.md
          labels: 'ai-report,enhancement'

      - name: Self-Heal (Format and Lint)
        run: npm run fix || true

      - name: Update Diagrams and Knowledge Graph
        run: |
          npx --yes tsx scripts/automation/generate-diagrams.ts
          npx --yes tsx scripts/automation/generate-knowledge-graph.ts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: autonomous repository self-healing and documentation updates'
          title: '🤖 Autonomous Self-Healing & Documentation Updates'
          body: |
            This PR was generated autonomously by the repository AI maintainer.

            **Changes Included:**
            - Self-healing formatting and linting fixes (`npm run fix`)
            - Architecture diagram updates
            - Knowledge graph generation
          branch: 'auto-healing-updates'
          labels: 'automated-pr,chore'
