name: AI Maintainer

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage_and_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (for PRs)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Checkout repo (for issues)
        if: github.event_name == 'issues'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: AI Issue Triage
        if: github.event_name == 'issues'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          npx --yes tsx scripts/automation/ai-triage.ts
          if test -f triage-comment.txt; then
            echo "has_triage_comment=true" >> $GITHUB_ENV
          fi

      - name: Post Triage Comment
        if: github.event_name == 'issues' && env.has_triage_comment == 'true'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043
        with:
          issue-number: ${{ github.event.issue.number }}
          body-path: 'triage-comment.txt'

      - name: AI PR Review
        if: github.event_name == 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes tsx scripts/automation/ai-pr-review.ts
          if test -f pr-comment.txt; then
            echo "has_pr_comment=true" >> $GITHUB_ENV
          fi

      - name: Post PR Review Comment
        if: github.event_name == 'pull_request' && env.has_pr_comment == 'true'
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b
        with:
          file-path: 'pr-comment.txt'
          comment-tag: ai-review
