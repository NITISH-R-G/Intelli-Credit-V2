name: Self-Healing Repository

on:
  schedule:
    - cron: '0 1 * * *' # Run daily at 1 AM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Node.js
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Self-Healing Tasks
        run: npm run fix

      - name: Create Pull Request for Fixes
        uses: peter-evans/create-pull-request@b99c9ae23bcf83f0f5aa571c2f0093de8aa85036
        with:
          commit-message: "chore: Automated self-healing fixes"
          title: "chore: Automated self-healing fixes"
          body: "Automated code formatting and linting fixes applied by the self-healing workflow."
          branch: "chore/auto-self-healing"
          labels: "automation, cleanup"
