name: Self-Healing Repository

on:
  schedule:
    - cron: '0 4 * * 0' # Run weekly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Self-Healing Fixes
        run: npm run fix || true # Allow it to proceed even if typecheck fails after fix

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          commit-message: 'chore: auto-fix linting and formatting issues'
          title: '🛠️ Automated Self-Healing Fixes'
          body: 'This PR automatically fixes linting and formatting issues using `npm run fix`.'
          branch: 'bot/auto-fix'
          labels: 'maintenance, automation'
