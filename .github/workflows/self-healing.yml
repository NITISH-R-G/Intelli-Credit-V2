name: Self-Healing Automation

on:
  schedule:
    - cron: '0 1 * * *' # Run daily at 1 AM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Node.js
        uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Self-Healing
        run: npm run fix

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@11fa467881691ac900904a2eea702c5ea848ad13
        with:
          commit-message: 'chore: autonomous self-healing (linting/formatting)'
          title: '[AI] Autonomous Self-Healing Fixes'
          body: 'This PR contains automated self-healing fixes generated by `npm run fix` (eslint and prettier auto-fixes).'
          branch: auto-healing-fixes
          delete-branch: true
          labels: automated pr, chore
