name: Self-Healing Maintenance

on:
  schedule:
    - cron: '0 5 * * 0' # Every Sunday at 5 AM

permissions:
  contents: write
  pull-requests: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup Node.js
        uses: actions/setup-node@680d1e489b82f1243de15bc7665c0007e3c9a860 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Self-Healing Fixes
        run: npm run fix

      - name: Create Pull Request for Fixes
        uses: peter-evans/create-pull-request@11e8dc7c9cc95aabee9cfaa85faaec8b50907340 # v7
        with:
          title: 'chore: Automated self-healing maintenance'
          commit-message: 'chore: Apply automated formatting and lint fixes'
          branch: 'auto-self-healing'
          labels: 'maintenance, automated'
          body: 'Automated PR resolving minor linting and formatting issues.'
