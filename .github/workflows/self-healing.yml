name: Self-Healing Automation

on:
  schedule:
    - interval: '0 2 * * 0' # Weekly on Sunday at 2am
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Auto Fixes
        run: npm run fix || true

      - name: Create Pull Request for Healing
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # v7.0.6
        with:
          commit-message: 'chore(healing): automated code formatting and linting fixes'
          title: 'chore(healing): Automated Code Fixes'
          body: 'Automated PR fixing formatting and linting issues generated by self-healing mechanisms.'
          branch: 'automation/self-healing'
          labels: maintenance, automated-pr
