name: Self-Healing Repository

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2am

permissions:
  contents: write
  pull-requests: write

jobs:
  self-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Self-Healing Fixes
        run: npm run fix

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # v7
        with:
          commit-message: 'chore: auto-fix linting and formatting issues'
          title: 'Automated Self-Healing Fixes'
          body: 'This PR automatically fixes linting and formatting issues detected during the weekly self-healing run.'
          branch: 'auto/self-healing'
          labels: automated pr, chore