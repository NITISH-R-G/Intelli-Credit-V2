name: Self-Healing Automation

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 4 AM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Use Node.js 20
        uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85 # v4.2.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Self-Healing
        run: npm run fix

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@11fa467881691ac900904a2eea702c5ea848ad13 # v7.0.6
        with:
          commit-message: "chore(auto): apply self-healing fixes"
          title: "chore(auto): apply self-healing fixes"
          body: "Autonomous self-healing: automated formatting and lint fixes."
          branch: "auto/self-healing"
          delete-branch: true
