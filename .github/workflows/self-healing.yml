name: Automated Self-Healing

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup Node.js
        uses: actions/setup-node@7f84f1d52d0c56afb45c62fee31a93b843cea4d6 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Self-Healing
        run: npm run self-healing

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@11e8dc7c9cc95aabee9cfaa85faaec8b50907340 # v6
        with:
          commit-message: 'chore: automated self-healing formatting and linting'
          title: 'Automated Repository Self-Healing'
          body: 'This PR applies automated self-healing actions such as linting fixes and code formatting.'
          branch: 'bot/self-healing'
          labels: 'maintenance'
