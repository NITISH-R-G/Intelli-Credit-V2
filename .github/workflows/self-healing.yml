name: Self-Healing Repository

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at midnight
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d59600a73b40d6cde101e4db95cddb2b80cc8e

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ff24f5d17a50e9326d9c
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Self-Healing Tasks
        run: npm run fix

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@153407881ce5f5b8cb39d7367cb62cb1fc4dd368
        with:
          title: 'chore: auto-heal formatting and linting'
          body: 'Automated fixes for formatting and linting issues generated by self-healing cron.'
          branch: 'auto/self-heal'
          commit-message: 'chore: auto-heal formatting and linting'
          base: 'main'
