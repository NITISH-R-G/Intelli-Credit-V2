name: Self-Healing Automation

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup Node.js
        uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Self-Healing Fixes
        run: npm run fix

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@59910dc44801a4d984ba473b7c2f20b850f9a584 # v6
        with:
          title: 'Automated Self-Healing Fixes'
          commit-message: 'chore: apply self-healing formatting and linting fixes'
          branch: 'auto-self-healing'
          body: 'This PR applies automated self-healing fixes, including formatting and linting.'
          labels: 'maintenance, automated'
