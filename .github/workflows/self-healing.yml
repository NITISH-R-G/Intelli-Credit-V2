name: Self-Healing Repository

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Self-Healing Tasks
        run: |
          npm run fix || echo "Fixes applied but some errors remain"
          npm audit fix || echo "Audit fixes applied"

      - name: Create Pull Request for Fixes
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: autonomous self-healing fixes'
          title: 'chore(self-healing): autonomous fixes for linting and security'
          body: |
            This PR contains automated self-healing fixes generated by running \`npm run fix\` and \`npm audit fix\`.
          branch: 'auto-self-healing'
          delete-branch: true
