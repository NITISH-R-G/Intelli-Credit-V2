name: Self-Healing

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Auto-Fix
        run: npm run fix
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@153407881ce5f5b0806cb7b7702f23b2b938f3be
        with:
          title: 'chore: Autonomous Self-Healing (Format & Lint)'
          branch: 'chore/self-healing'
          commit-message: 'chore: Autonomous Self-Healing (Format & Lint)'
          body: 'Automatically applied format and lint fixes via npm run fix.'
