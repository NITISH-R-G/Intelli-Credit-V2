name: Self-Healing Repository

on:
  schedule:
    - cron: '0 2 * * *' # Run daily at 2am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Self-Healing
        run: npm run fix

      - name: Create Pull Request for Fixes
        uses: peter-evans/create-pull-request@153407881ce5f5b28cb37d288bde1ce6a5d487f9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: autonomously fix formatting and linting issues"
          title: "Autonomously applied code quality fixes"
          body: "This PR contains automatic fixes for code style and linting issues generated by self-healing automation."
          branch: "auto-self-heal"
          labels: "refactor,automated"
