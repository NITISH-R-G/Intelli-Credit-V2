name: Self-Healing Repository

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820.x020.x # v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Self-Healing Fixes
        run: npm run fix

      - name: Create Pull Request for Fixes
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: 'fix: auto-healing repository code style and lint issues'
          title: 'Automated Self-Healing Fixes'
          body: 'This PR applies automated formatting and linting fixes.'
          branch: 'auto/self-healing'
