name: Self-Healing Repository

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - name: Run Auto-Fixes
        run: npm run fix

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f
        with:
          commit-message: 'chore: autonomous self-healing (lint/format)'
          title: 'Automated Repository Self-Healing'
          body: 'This PR was automatically generated to fix linting and formatting issues.'
          branch: 'auto/self-healing'
