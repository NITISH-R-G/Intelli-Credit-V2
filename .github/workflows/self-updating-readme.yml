name: Self-Updating README

# Manual-only. Previously this ran on every push to main AND on completion of
# "Autonomous Repository Analysis" (workflow_run), auto-committing a rewritten
# README + docs/. This is what produced stale-snapshot commits that reverted
# intentional refactors. Run it manually (Actions tab → "Run workflow") after
# intentional structural changes; review the diff before pushing.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run README Generator
        run: npm run generate:readme
        continue-on-error: true

      - name: Commit README Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md docs/ || true
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs: refresh README and documentation [skip ci]"
            git push
          fi
