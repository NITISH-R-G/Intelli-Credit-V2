name: Autonomous Repository Analysis

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: write

jobs:
  analyze-repo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Repository Analyzer
        run: npm run analyze:repo
        continue-on-error: true

      - name: Run Architecture/Knowledge Graph Generator
        run: npm run generate:diagrams
        continue-on-error: true

      - name: Commit Architecture Updates
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/architecture/ metadata.json docs/knowledge-graph.json || true
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs(architecture): Update autonomous repository analysis and knowledge graph [skip ci]"
            git pull --rebase origin "$HEAD_REF" || true
            git push origin HEAD:"$HEAD_REF" || true
          fi
