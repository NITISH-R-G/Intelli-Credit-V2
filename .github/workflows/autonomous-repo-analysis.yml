name: Autonomous Repository Analysis

# Manual-only. Previously this ran on push/PR/weekly and auto-committed
# regenerated metadata.json + architecture docs to main — which produced
# stale snapshots that reverted intentional refactors. Run this manually
# (Actions tab → "Run workflow") after intentional structural changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-repo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Repository Analyzer
        run: npm run analyze:repo
        continue-on-error: true

      - name: Run Architecture/Knowledge Graph Generator
        run: npm run generate:diagrams
        continue-on-error: true

      - name: Commit Architecture Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/architecture/ metadata.json || true
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs(architecture): refresh repository analysis and knowledge graph [skip ci]"
            git push
          fi
