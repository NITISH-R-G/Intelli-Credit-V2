name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@680d1e489b82f1243de15bc7665c0007e3c9a860 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch PR Diff
        env:
          PR_URL: ${{ github.event.pull_request.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          curl -s -H "Accept: application/vnd.github.v3.diff"
          -H "Authorization: Bearer $GITHUB_TOKEN"
          "$PR_URL" > pr-diff.txt

      - name: Run AI PR Review
        run: npm run ai:pr-review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Post PR Review Comment
        if: hashFiles('pr-comment.txt') != ''
        uses: thollander/actions-comment-pull-request@e4a76dd2b0a3c2027c3fd84147a67c22ee4c90fa # v2
        with:
          file-path: pr-comment.txt
          comment-tag: ai-pr-review
