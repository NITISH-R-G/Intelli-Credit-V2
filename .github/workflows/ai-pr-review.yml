name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Capture PR Diff and Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Use fetch diff strategy as per memory guidelines
          export PR_DIFF="$(git diff origin/$BASE_REF...HEAD)"
          npm run ai:pr-review

      - name: Comment on PR
        if: hashFiles('pr-review.txt') != ''
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: pr-review.txt
          comment-tag: ai-pr-review
