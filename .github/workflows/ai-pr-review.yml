name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch code securely
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          # Checkout the base branch so we run our trusted review script
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v4
        with:
          node-version: 20

      - name: Install dependencies safely
        # Use --ignore-scripts just to be safe
        run: npm ci --ignore-scripts

      - name: Fetch PR branch for diff
        run: git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head || true

      - name: Generate PR Diff
        run: git diff HEAD...pr-head > pr-diff.txt || true

      - name: Run AI PR Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Install tsx globally or simply use npx to run without compiling the entire project. This solves missing script and module resolution issues.
        run: npx --yes tsx scripts/automation/ai-pr-review.ts

      - name: Comment on PR
        if: hashFiles('pr-comment.txt') != ''
        uses: thollander/actions-comment-pull-request@e4a76dd2b0a3c2027c3fd84147a67c22ee4c90fa
        with:
          file-path: pr-comment.txt
          comment-tag: ai-review
