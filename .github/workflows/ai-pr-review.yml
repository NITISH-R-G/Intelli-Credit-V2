name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d59600a944203117b4c910fa78c1827b5bddfa
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Fetch PR Diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN"
          -H "Accept: application/vnd.github.v3.diff"
          ${{ github.event.pull_request.url }} > pr-diff.txt

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run AI PR Review
        run: npx --yes tsx scripts/automation/ai-pr-review.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Comment on PR
        if: hashFiles('pr-comment.txt') != ''
        uses: thollander/actions-comment-pull-request@v2
        with:
          file-path: pr-comment.txt
          comment-tag: ai-review
