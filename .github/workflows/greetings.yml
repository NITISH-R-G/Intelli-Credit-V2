name: Greetings

on: [pull_request, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@3c71ce730280171fd1cfb57c00c774f8998586f7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Welcome to the repository! We appreciate you opening this issue. An AI maintainer or human contributor will review it shortly. Please ensure you have provided all necessary context.'
          pr-message: 'Thank you for your pull request! We will run our automated checks and an AI reviewer will provide initial feedback soon. Please make sure your PR description clearly outlines the changes made.'
