name: Repository Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Repo Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run analyze:repo
      - name: Commit diagrams and knowledge graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update architecture diagrams and knowledge graph"
          file_pattern: "docs/architecture/*"
