name: Repository Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Repository Analysis
        run: npm run analyze:repo

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Generate Diagrams
        run: npm run generate:diagrams

      - name: Generate Knowledge Graph
        run: npm run generate:knowledge-graph

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/
          git commit -m "docs: auto-generate repository architecture and knowledge graph" || echo "No changes to commit"
          git push
